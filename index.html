<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Wedding Story Begins</title>
  
  <!-- FontAwesome 아이콘 라이브러리 (하트 및 음표) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* 커스텀 폰트 불러오기 (파일명 정확히 일치) */
    @font-face {
      font-family: 'FreakArt Personal Use';
      src: url('FreakArt-Personal-Use.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    
    /* 폰트 적용 */
    .header-title {
      font-family: 'FreakArt Personal Use', cursive, sans-serif !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Apple SD Gothic Neo', sans-serif;
    }

    .wedding-card {
      width: 100%;
      max-width: 430px; /* 모바일 프레임 규격 */
      background-color: #ffffff;
      position: relative;
      overflow: hidden;
    }

    /* 1. 우측 상단 고정 음악(BGM) 버튼 */
    .bgm-btn {
      position: fixed;
      top: 18px;
      right: calc(50% - 200px); /* 모바일 카드 기준 우측 상단 고정 */
      z-index: 9999;
      width: 40px;
      height: 40px;
      background-color: rgba(255, 255, 255, 0.85);
      border: 1.5px solid #e59bb3;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e59bb3;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
    }
    @media (max-width: 430px) {
      .bgm-btn {
        right: 18px;
      }
    }
    .bgm-btn.playing {
      background-color: #e59bb3;
      color: #ffffff;
      animation: spin 4s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* 2. 헤더 섹션 레이아웃 */
    .header-section {
      position: relative;
      width: 100%;
      background: url('sec1-bg.png') no-repeat center top / cover;
      min-height: 910px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 타이틀 텍스트 영역 */
    .header-title {
      margin-top: 75px;
      text-align: center;
      font-family: 'FreakArt Personal Use', 'Georgia', cursive, serif;
      font-size: 55px;
      color: #ffffff;
      line-height: 53px;
      letter-spacing: 0;
      z-index: 2;
    }

    /* FontAwesome 하트 스타일 */
    .header-title .fa-heart {
      color: #DE7DA6;
      font-size: 32px;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* 섹션 이미지 반응형 스타일 */
    .img-sec {
      width: 100%;
      height: auto;
      display: block;
      position: relative;
      margin-top: -80px; /* 헤더 이미지 영역 위로 끌어올려 겹치게 설정 */
      z-index: 10;        /* 헤더 배경보다 위층에 배치 */
    }

    /* 계좌번호 영역 */
    .account-section {
      background-color: #fff2f5;
      padding: 30px 20px;
      text-align: center;
    }
    .account-title-badge {
      display: inline-block;
      background-color: #e59bb3;
      color: white;
      font-size: 18px;
      padding: 6px 20px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .account-group {
      text-align: left;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.8);
      padding: 15px;
      border-radius: 12px;
    }
    .account-group-title {
      font-weight: bold;
      font-size: 16px;
      color: #333;
      margin-bottom: 10px;
    }
    .account-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed #eee;
      font-size: 14px;
      color: #555;
    }
    .account-row:last-child {
      border-bottom: none;
    }
    .btn-copy {
      background-color: #fff;
      border: 1px solid #ddd;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      color: #333;
    }

    /* 지도 및 안내 */
    .location-info {
      padding: 20px;
      font-size: 14px;
      color: #444;
      line-height: 1.6;
      background: #fff;
    }
    .location-info h4 {
      font-size: 16px;
      margin-top: 10px;
      margin-bottom: 5px;
      color: #e59bb3;
    }

    .btn-guestbook {
      display: block;
      width: 80%;
      margin: 20px auto;
      padding: 12px;
      background-color: #e59bb3;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- BGM 음악 오디오 태그 -->
  <audio id="bgm" src="360.mp4" loop></audio>
  
  <!-- 우측 상단 노래 표시 컨트롤 버튼 -->
  <button id="bgmBtn" class="bgm-btn" onclick="toggleBgm()" title="배경음악 재생/일시정지">
    <i class="fa-solid fa-music"></i>
  </button>

  <div class="wedding-card">
    
    <!-- 1. 헤더 섹션 -->
    <div class="header-section">
      <h1 class="header-title">
        Our Wedding Story<br>
        Begins <i class="fa-solid fa-heart"></i>
      </h1>
    </div>

    <!-- 2. 초대글 편지 이미지 섹션 -->
    <img class="img-sec" src="sec2-letter.png" alt="정철민 최유리 초대글">

  </div>

  <script>
    const bgm = document.getElementById('bgm');
    const bgmBtn = document.getElementById('bgmBtn');
    let isPlaying = false;

    // BGM 토글
    function toggleBgm() {
      if (isPlaying) {
        bgm.pause();
        bgmBtn.classList.remove('playing');
      } else {
        bgm.play();
        bgmBtn.classList.add('playing');
      }
      isPlaying = !isPlaying;
    }

    // 모바일 터치 시 자동 재생 처리
    // document.addEventListener('click', function firstClick() {
    //   if (!isPlaying) {
    //     bgm.play().then(() => {
    //       isPlaying = true;
    //       bgmBtn.classList.add('playing');
    //     }).catch(() => {});
    //   }
    //   document.removeEventListener('click', firstClick);
    // }, { once: true });


    // 1. 페이지 로드 시 즉시 자동재생 시도 (일부 인앱 브라우저 대응)
    window.addEventListener('DOMContentLoaded', () => {
      playAudio();
    });
  
    // 2. 브라우저 제한 완화를 위해 화면 첫 터치/클릭/스크롤 시 즉시 재생
    const enableAudioOnInteraction = () => {
      playAudio();
      // 한 번 실행된 후 이벤트 리스너 제거
      window.removeEventListener('touchstart', enableAudioOnInteraction);
      window.removeEventListener('click', enableAudioOnInteraction);
      window.removeEventListener('scroll', enableAudioOnInteraction);
    };
  
    window.addEventListener('touchstart', enableAudioOnInteraction, { once: true });
    window.addEventListener('click', enableAudioOnInteraction, { once: true });
    window.addEventListener('scroll', enableAudioOnInteraction, { once: true });

    // 계좌 복사
    function copyAccount(accountNumber) {
      navigator.clipboard.writeText(accountNumber).then(() => {
        alert("계좌번호가 복사되었습니다: " + accountNumber);
      }).catch(err => {
        alert("복사에 실패했습니다.");
      });
    }
  </script>
</body>
</html>
