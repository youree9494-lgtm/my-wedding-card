<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정철민 · 최유리 결혼식에 소중한 분들을 초대합니다🕊️ </title>
  <!-- 공유용 제목 (타이틀) -->
  <meta property="og:title" content="정철민 · 최유리 결혼식에 소중한 분들을 초대합니다🕊️">
  <!-- 공유용 설명 (서브타이틀) -->
  <meta property="og:description" content="2026.11.14 토요일 오후 5시 20분 | 인천 웨스턴팰리스 팰리스홀">
  <!-- 공유용 썸네일 이미지 (필수) -->
  <meta property="og:image" content="https://youree9494-lgtm.github.io/my-wedding-card/sec1-bg.png">
  <!-- FontAwesome 아이콘 라이브러리 (하트 및 음표) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* 1. 커스텀 폰트 불러오기 */
    @font-face {
      font-family: 'FreakArt Personal Use';
      src: url('FreakArt-Personal-Use.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Apple SD Gothic Neo', sans-serif;
    }

    .wedding-card {
      width: 100%;
      max-width: 430px; /* 모바일 프레임 규격 */
      background-color: #ffffff;
      position: relative;
      overflow: hidden;
    }

    /* 우측 상단 고정 음악(BGM) 버튼 */
    .bgm-btn {
      position: fixed;
      top: 18px;
      right: calc(50% - 200px);
      z-index: 9999;
      width: 40px;
      height: 40px;
      background-color: rgba(255, 255, 255, 0.85);
      border: 1.5px solid #e59bb3;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e59bb3;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
    }
    @media (max-width: 430px) {
      .bgm-btn {
        right: 18px;
      }
    }
    .bgm-btn.playing {
      background-color: #e59bb3;
      color: #ffffff;
      animation: spin 4s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* 헤더 섹션 레이아웃 */
    .header-section {
      position: relative;
      width: 100%;
      background: url('sec1-bg.png') no-repeat center top / cover;
      min-height: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    /* 타이틀 텍스트 영역 */
    .header-title {
      margin-top: 75px;
      text-align: center;
      font-family: 'FreakArt Personal Use', 'Georgia', cursive, serif !important;
      font-size: 55px;
      color: #ffffff;
      line-height: 53px;
      letter-spacing: 0;
      z-index: 2;
      text-shadow: 0px 2px 3px rgba(0, 0, 0, 0.25);
    }

    .header-title .fa-heart {
      color: #DE7DA6;
      font-size: 32px;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* 초대글(편지) 섹션 컨테이너 */
    .letter-section {
      position: relative;
      width: 100%;
      margin-top: -118px; /* 헤더 상단 이미지와 겹치게 배치 */
      z-index: 1;
    }

    /* 배경 이미지 */
    .letter-bg-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 편지 배경 위 텍스트 오버레이 영역 */
    .letter-content-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 247px; /* 카드 이미지 내 흰색 하트 위치에 맞춘 상단 여백 */
    }

    /* 1. 정철민 · 최유리 스타일 */
    .couple-names {
      font-family: 'GriunXHangeul Gowoon', 'Gowun Dodum', sans-serif;
      font-size: 39.55px;
      color: #222222;
      font-weight: normal;
      text-align: center;
      /* 외곽선 0.31px 효과 */
      -webkit-text-stroke: 0.31px #222222;
      margin-bottom: 1px;
    }

    /* 2. 일시 및 장소 스타일 */
    .wedding-date-location {
      font-family: 'GriunXHangeul Gowoon', 'Gowun Dodum', sans-serif;
      font-size: 19.78px;
      color: #222222;
      letter-spacing: -0.01em; /* -1% */
      text-align: center;
      line-height: 1.4;
      margin-bottom: 110px; /* 편지 봉투 영역까지 하단 여백 확보 */
    }

    /* 3. 초대글 본문 문구 스타일 */
    .letter-text {
      font-family: 'Nanum DdarEGeEomMaGa', 'Nanum Pen Script', cursive, sans-serif;
      font-size: 23px;
      line-height: 38px;
      letter-spacing: 0.02em; /* 2% */
      color: #000000;
      text-align: center;
      /* 외곽선 0.5px 효과 */
      -webkit-text-stroke: 0.5px #000000;
      width: 80%;
      margin-top: 202px;
    }

    .letter-text p {
      margin-bottom: 42px; /* 단락 간격 */
    }
    .letter-text p:last-child {
      margin-bottom: 0;
    }

    /* [섹션 3] 부모님 편지 및 어릴적 사진 섹션 */
    .sec3-container {
      position: relative;
      width: 100%;
      background: url('sec3_bg.png') no-repeat center top / cover;
      padding: 50px 25px 60px 25px;
      display: flex;
      flex-direction: column;
      gap: 50px;
    }

    /* 공통 타이틀 스타일 */
    .parents-title {
      font-family: 'GriunXHangeul Gowoon', 'Gowun Dodum', sans-serif;
      font-size: 22px;
      color: #000000;
      line-height: 1.3;
    }

    .parents-title .child-name {
      font-size: 30px;
      font-weight: normal;
      -webkit-text-stroke: 0.3px #000000;
    }

    /* 신랑측 박스 (우측 상단 사진) */
    .groom-block {
      display: flex;
      flex-direction: column;
      margin-top: 106px;
    }

    .groom-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .groom-header .parents-title {
      flex: 1;
      padding-right: 15px;
      padding-bottom: 10px;
      transform: translate(62px, -69px);
    }

    .groom-photo {
      width: 200px;
      height: auto;
      display: block;
      flex-shrink: 0;
    }

    .groom-letter-img {
      width: 106%;
      height: auto;
      display: block;
      transform: translate(0px, -69px);
    }

    /* 신부측 박스 (좌측 상단 사진) */
    .bride-block {
      display: flex;
      flex-direction: column;
    }

    .bride-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 15px;
    }

    .bride-photo {
      width: 200px;
      height: auto;
      display: block;
      flex-shrink: 0;
      transform: translate(-29px);
    }

    .bride-header .parents-title {
      text-align: left;
      flex: 1;
      transform: translate(-60px, -161px);
    }

    .bride-letter-img {
      width: 62%;
      height: auto;
      display: block;
      transform: translate(158px, -201px);
    }

    /* [섹션 4] 웨딩 앨범 컨테이너 */
    .sec4-container {
      position: relative;
      width: 100%;
      min-height: 850px;
      background: url('sec4_bg.png') no-repeat center top / cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* 상단 구름 및 CLICK ME 영역 */
    .click-me-wrapper {
      position: relative;
      width: 280px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .cloud-bg {
      position: absolute;
      width: 80%;
      height: auto;
      z-index: 1;
    }

    /* CLICK ME !! 알록달록 텍스트 */
    .click-me-text {
      position: relative;
      z-index: 2;
      font-family: 'FreakArt Personal Use', cursive, sans-serif;
      font-size: 48.79px;
      font-weight: bold;
      line-height: 45.5px;
      letter-spacing: 0em;
      text-align: center;
      margin-top: -6px;
    }

    /* 각 글자별 채우기 색상 지정 */
    .click-me-text span:nth-child(1) { color: #3F689A; } /* C */
    .click-me-text span:nth-child(2) { color: #4091D3; } /* L */
    .click-me-text span:nth-child(3) { color: #A4D28E; } /* I */
    .click-me-text span:nth-child(4) { color: #AB7E6B; } /* C */
    .click-me-text span:nth-child(5) { color: #CDBFA2; } /* K */
    .click-me-text span:nth-child(6) { color: transparent; width: 10px; display: inline-block; } /* 공백 */
    .click-me-text span:nth-child(7) { color: #D780B5; } /* M */
    .click-me-text span:nth-child(8) { color: #F5C3CC; } /* E */
    .click-me-text span:nth-child(9) { color: transparent; width: 10px; display: inline-block; } /* 공백 */
    .click-me-text span:nth-child(10) { color: #3F689A; } /* ! */
    .click-me-text span:nth-child(11) { color: #4091D3; } /* ! */

    /* 느낌표(!) 전용 스타일 교정 */
    .click-me-text .excl {
      font-family: 'FreakArt Personal Use', 'Georgia', serif !important;
      font-weight: normal;
      display: inline-block;
      transform: scaleY(1.1); /* 피그마처럼 세로로 살짝 길게 교정 */
    }

    /* 분홍색 화살표 */
    .pink-arrow {
      position: absolute;
      right: -51px;
      bottom: -85px;
      width: 180px;
      height: auto;
      z-index: 3;
    }

    /* 메인 앨범 커버 버튼 */
    .album-cover-btn {
      position: relative;
      width: 320px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      z-index: 2;
    }
    
    .album-cover-btn:hover {
      transform: scale(1.02);
    }

    .album-cover-img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0px 8px 15px rgba(0, 0, 0, 0.15));
      margin-left: 10px;
    }

    /* 하단 안내 텍스트 영역 */
    .album-notice-wrapper {
      position: relative;
      width: 100%;
      max-width: 320px;
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 보라색 화살표 */
    .purple-arrow {
      position: absolute;
      left: 0px;
      top: -82px;
      width: 143px;
      height: auto;
      z-index: 3;
    }

    /* 하단 안내 문구 */
    .album-notice-text {
      font-family: 'EF_jejudoldam', sans-serif;
      font-size: 24px;
      line-height: 31px;
      letter-spacing: 0em;
      color: #5E1F00;
      text-align: center;
      margin-top: 20px;
    }

    /* ==========================================
       책 넘김 팝업 (3D Flip Book Modal)
    ========================================== */
    .album-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
    }

    .album-modal.active {
      display: flex;
    }

    /* 닫기 버튼 */
    .modal-close-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      color: #ffffff;
      font-size: 35px;
      cursor: pointer;
      z-index: 100001;
    }

    /* 3D 앨범 본체 */
    .book-container {
      width: 320px;
      height: 440px;
      position: relative;
      perspective: 1500px;
    }

    .book-page {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    .page-front, .page-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 8px;
      overflow: hidden;
      background-color: #fff;
    }

    .page-front img, .page-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .page-back {
      transform: rotateY(180deg);
    }

    /* 책이 넘겨진 상태 클래스 */
    .book-page.flipped {
      transform: rotateY(-180deg);
    }

    /* 페이지 안내 가이드 */
    .album-hint {
      position: absolute;
      bottom: 30px;
      color: #ffffff;
      font-size: 14px;
      font-family: sans-serif;
      opacity: 0.8;
    }

    /* 계좌번호 영역 */
    .account-section {
      background-color: #fff2f5;
      padding: 30px 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- BGM 음악 오디오 태그 -->
  <audio id="bgm" src="360.mp4" loop></audio>
  
  <!-- 우측 상단 노래 표시 컨트롤 버튼 -->
  <button id="bgmBtn" class="bgm-btn" onclick="toggleBgm()" title="배경음악 재생/일시정지">
    <i class="fa-solid fa-music"></i>
  </button>

  <div class="wedding-card">
    
    <!-- 1. 헤더 섹션 -->
    <div class="header-section">
      <h1 class="header-title">
        Our Wedding Story<br>
        Begins <i class="fa-solid fa-heart"></i>
      </h1>
    </div>

    <!-- 2. 초대글 편지 이미지 & 텍스트 오버레이 섹션 -->
    <div class="letter-section">
      <!-- 배경으로 깔리는 이미지 -->
      <img class="letter-bg-img" src="sec2-letter.png" alt="초대글 배경">

      <!-- 이미지 위에 위치하는 텍스트들 -->
      <div class="letter-content-overlay">
        <!-- 1) 신랑 신부 이름 -->
        <div class="couple-names">정철민 · 최유리</div>

        <!-- 2) 예식 일시 및 장소 -->
        <div class="wedding-date-location">
          2026.11.14 토요일 5시 20분<br>
          인천 웨스턴팰리스 &lt;팰리스홀&gt;
        </div>

        <!-- 3) 편지 본문 문구 -->
        <div class="letter-text">
          <p>
            서로를 바라보던 시간이 쌓여<br>
            이제는 나란히 같은 방향을<br>
            바라보게 되었습니다.
          </p>
          <p>
            서툴지만 단단한 두 사람이<br>
            하나의 계절을 시작하려 합니다.
          </p>
          <p>
            그 시작의 순간에<br>
            함께 해 주신다면<br>
            더 없이 기쁠 것 같습니다.
          </p>
        </div>
      </div>
    </div> <!-- .letter-section 닫기 -->

    <!-- 3. 부모님 메시지 & 어릴적 사진 섹션 -->
    <div class="sec3-container">
      <!-- 신랑측 (정철민) -->
      <div class="groom-block">
        <div class="groom-header">
          <div class="parents-title">
            정기준 &amp; 이경화의 <br>&nbsp;&nbsp;아들
            <span class="child-name">정철민</span>
          </div>
          <img class="groom-photo" src="cm_child.png" alt="정철민 어린시절">
        </div>
        <img class="groom-letter-img" src="cm_daddy.png" alt="신랑 부모님 편지">
      </div>

      <!-- 신부측 (최유리) -->
      <div class="bride-block">
        <div class="bride-header">
          <img class="bride-photo" src="yr_child.png" alt="최유리 어린시절">
          <div class="parents-title">
            최만순 &amp; 경창희의 <br>&nbsp;&nbsp;딸
            <span class="child-name">&nbsp;&nbsp;최유리</span>
          </div>
        </div>
        <img class="bride-letter-img" src="yr_mommy.png" alt="신부 부모님 편지">
      </div>
    </div> <!-- .sec3-container 닫기 -->

    <!-- 4. 웨딩 앨범 섹션 -->
    <div class="sec4-container">
      <!-- 상단 CLICK ME !! (구름 배경 + 타이포) -->
      <div class="click-me-wrapper">
        <img src="sec4_cloud.png" class="cloud-bg" alt="구름 배경">
        <div class="click-me-text">
          <span>C</span><span>L</span><span>I</span><span>C</span><span>K</span><span> </span><span>M</span><span>E</span><span class="excl">!</span><span class="excl">!</span>
        </div>
        <img src="sec4_arrow_pink.png" class="pink-arrow" alt="화살표">
      </div>

      <!-- 메인 앨범 커버 클릭 영역 -->
      <div class="album-cover-btn" onclick="openAlbumModal()">
        <img src="sec4_album.png" class="album-cover-img" alt="OUR WEDDING ALBUM">
      </div>

      <!-- 하단 안내 문구 영역 -->
      <div class="album-notice-wrapper">
        <img src="sec4_arrow_purple.png" class="purple-arrow" alt="화살표">
        <div class="album-notice-text">
          앨범을 누르시면<br>저희 사진을 볼 수 있어요!
        </div>
      </div>
    </div> <!-- .sec4-container 닫기 -->

  </div> <!-- .wedding-card 닫기 -->

  <!-- 앨범 3D 책 넘김 팝업 (모달) -->
  <div id="albumModal" class="album-modal">
    <span class="modal-close-btn" onclick="closeAlbumModal()">&times;</span>
    
    <div class="book-container">
      <!-- 1페이지 (커버 -> 사진1) -->
      <div class="book-page" style="z-index: 3;" onclick="flipPage(this)">
        <div class="page-front">
          <img src="sec4_album.png" alt="앨범 표지">
        </div>
        <div class="page-back">
          <img src="album_1.jpg" alt="앨범 사진 1">
        </div>
      </div>

      <!-- 2페이지 (사진2 -> 사진3) -->
      <div class="book-page" style="z-index: 2;" onclick="flipPage(this)">
        <div class="page-front">
          <img src="album_2.jpg" alt="앨범 사진 2">
        </div>
        <div class="page-back">
          <img src="album_3.jpg" alt="앨범 사진 3">
        </div>
      </div>

      <div class="book-page">
        <div class="page-front">
          <img src="album_4.jpg" alt="앨범 사진 4">
        </div>
      </div>

      <div class="book-page">
        <div class="page-front">
          <img src="album_5.jpg" alt="앨범 사진 5">
        </div>
      </div>

      <div class="book-page">
        <div class="page-front">
          <img src="album_6.jpg" alt="앨범 사진 6">
        </div>
      </div>

      <div class="book-page">
        <div class="page-front">
          <img src="album_7.jpg" alt="앨범 사진 7">
        </div>
      </div>

      <div class="book-page">
        <div class="page-front">
          <img src="album_8.jpg" alt="앨범 사진 8">
        </div>
      </div>

      <div class="book-page">
        <div class="page-front">
          <img src="album_9.jpg" alt="앨범 사진 9">
        </div>
      </div>

  <!-- JavaScript 동작 스크립트 -->
  <script>
    // 앨범 모달 열기/닫기
    function openAlbumModal() {
      document.getElementById('albumModal').classList.add('active');
    }

    function closeAlbumModal() {
      const modal = document.getElementById('albumModal');
      modal.classList.remove('active');
      
      // 모달을 닫을 때 넘긴 책장 초기화
      setTimeout(() => {
        const pages = document.querySelectorAll('.book-page');
        pages.forEach(page => page.classList.remove('flipped'));
      }, 300);
    }

    // 3D 책장 넘김 효과
    function flipPage(element) {
      element.classList.toggle('flipped');
    }

    // BGM 관련 코드
    const bgm = document.getElementById('bgm');
    const bgmBtn = document.getElementById('bgmBtn');
    let isPlaying = false;

    function playAudio() {
      if (!isPlaying) {
        bgm.play().then(() => {
          isPlaying = true;
          bgmBtn.classList.add('playing');
        }).catch(err => {});
      }
    }

    function toggleBgm() {
      if (isPlaying) {
        bgm.pause();
        bgmBtn.classList.remove('playing');
        isPlaying = false;
      } else {
        playAudio();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      playAudio();
    });

    const enableAudioOnInteraction = () => {
      playAudio();
      window.removeEventListener('touchstart', enableAudioOnInteraction);
      window.removeEventListener('click', enableAudioOnInteraction);
      window.removeEventListener('scroll', enableAudioOnInteraction);
    };

    window.addEventListener('touchstart', enableAudioOnInteraction, { once: true });
    window.addEventListener('click', enableAudioOnInteraction, { once: true });
    window.addEventListener('scroll', enableAudioOnInteraction, { once: true });

    function copyAccount(accountNumber) {
      navigator.clipboard.writeText(accountNumber).then(() => {
        alert("계좌번호가 복사되었습니다: " + accountNumber);
      }).catch(err => {
        alert("복사에 실패했습니다.");
      });
    }
  </script>
